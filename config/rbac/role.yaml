# Permissions the controller needs (matches the +kubebuilder:rbac markers).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: website-operator-manager-role
rules:
  - apiGroups: ["web.example.com"]
    resources: ["websites"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["web.example.com"]
    resources: ["websites/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["web.example.com"]
    resources: ["websites/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
